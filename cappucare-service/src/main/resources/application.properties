spring.application.name=cappucare-service
server.port=8080

# Base de datos en memoria (H2). Se reinicia con el servidor.
spring.datasource.url=jdbc:h2:mem:cappucare;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola H2 para la demo: http://localhost:8080/h2-console
spring.h2.console.enabled=true
